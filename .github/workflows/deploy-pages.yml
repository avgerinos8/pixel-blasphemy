name: Deploy PixelBlasphemy Studio to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Set permissions for GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload PixelBlasphemy Studio (app/ directory)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
